# Keeps the profile README up to date.
#
# Runs every Monday, on demand, and whenever the generator or this workflow
# changes. Each job commits only when its output actually changed, so repeated
# runs over the same data produce no new commits.

name: Profile refresh

on:
  schedule:
    - cron: "0 5 * * *"   # Todos los días a las 12:00 AM en Bogotá (05:00 UTC).
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  readme:
    name: Languages, icons and README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate assets and README blocks
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md icons
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh profile assets"
            git pull --rebase
            git push
          fi

  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    needs: readme
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # Includes the commit pushed by the previous job.

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: DavidRamirez206
          outputs: |
            icons/snake-dark.svg?palette=github-dark&color_snake=#0888F8&color_dots=#161B22,#0A2156,#072897,#1F6BD9,#5AA9FF
            icons/snake-light.svg?palette=github-light&color_snake=#072897&color_dots=#EBEDF0,#DCE8FF,#5AA9FF,#1F6BD9,#072897

      # Redraws each contribution cell as a coffee cup; an unrecognized snk
      # format leaves the files as generated and only prints a warning.
      - name: Turn contribution cells into coffee cups
        run: python3 scripts/coffee_snake.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/snake-dark.svg icons/snake-light.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh contribution snake"
            git pull --rebase
            git push
          fi

  overview:
    name: Activity overview
    runs-on: ubuntu-latest
    needs: snake
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.profile.svg
          token: ${{ secrets.METRICS_TOKEN }}
          # The render embeds its generation time; compare the data instead so an
          # unchanged overview is not committed again.
          output_condition: data-changed
          committer_message: "chore: refresh activity overview"
          user: DavidRamirez206
          base: header, activity, community
          config_timezone: America/Bogota
          config_display: large
          repositories: 1000
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes
